# Weekly pull requests for outdated dependencies and GitHub Actions (the
# actions are pinned by commit: Dependabot updates the pins).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      # The Windows MIDI Services bindings are generated by windows-bindgen
      # against windows-core: these crates only move together.
      windows:
        patterns:
          - "windows*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
