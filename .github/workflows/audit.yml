name: Audit

# Known vulnerabilities in the dependencies: weekly, and when a lockfile
# changes.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - package-lock.json
      - src-tauri/Cargo.lock
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # Only what ships: the frontend bundle's dependencies.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock
