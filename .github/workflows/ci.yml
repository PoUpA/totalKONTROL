name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      # Show the result for every OS, even if one of them fails.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # System dependencies for Tauri 2 (WebKitGTK…) and midir (ALSA).
      - name: System dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      # Formatting does not depend on the OS: checked once.
      - name: Formatting (Prettier, rustfmt)
        if: runner.os == 'Linux'
        run: npm run format:check

      - name: Frontend tests (vitest)
        run: npm test

      # Must run before cargo: generate_context! needs dist/.
      - name: Build the frontend (tsc + vite)
        run: npm run build

      # --locked: Cargo.lock is versioned and must not drift.
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The winmidi installers are only built on a release tag: check this
      # variant on every push too, or a regression shows only at release.
      - name: Cache the Windows MIDI Services package
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/vendor/windows-midi2
          key: windows-midi2-${{ hashFiles('scripts/fetch-windows-midi.ps1') }}

      - name: Clippy and tests (Windows MIDI Services)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch-windows-midi.ps1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --features windows-midi-services -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets --features windows-midi-services
