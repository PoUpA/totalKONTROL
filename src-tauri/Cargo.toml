[package]
name = "totalkontrol"
version = "0.1.3"
description = "Full control of the Korg padKONTROL"
authors = ["PoUpA"]
license = "MIT"
repository = "https://github.com/PoUpA/totalKONTROL"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "totalkontrol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Windows: the app creates its own virtual MIDI device through Windows MIDI
# Services, instead of loopMIDI. Requires the Windows.Devices.Midi2 package in
# vendor/windows-midi2 (see scripts/fetch-windows-midi.ps1).
windows-midi-services = [
    "dep:windows-core",
    "dep:windows-collections",
    "dep:windows-future",
    "dep:windows-time",
    "dep:windows-bindgen",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }
windows-bindgen = { version = "0.100", optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.11"
sys-locale = "0.3.2"
rosc = "0.11.4"
enigo = "0.6.1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-core = { version = "0.100", optional = true }
windows-collections = { version = "0.100", optional = true }
windows-future = { version = "0.100", optional = true }
windows-time = { version = "0.100", optional = true }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
jsonschema = "0.59.0"
